# Alembic 設定。指令一律從 `apps/api/` 執行 (`uv run alembic …`), 產生 revision 用 `make db migration "說明"`。
#
# **這裡刻意沒有 `sqlalchemy.url`。** 連線字串裡有密碼, 而這個檔案進版控;
# `migrations/env.py` 改成從環境變數 `POSTGRES_URL` 取, 理由寫在那支的 docstring。
# 樣板產生的那行佔位 URL (`driver://user:pass@localhost/dbname`) 已經刪掉 ——
# 留著只會讓人以為那裡要填東西。

[alembic]
script_location = %(here)s/migrations

# alembic 從 `apps/api/` 執行, 這一行讓 env.py import 得到 `app` / `shared` / `modules`。
prepend_sys_path = .

path_separator = os

# 檔名帶日期前綴。**revision 的執行順序來自 `down_revision` 串起來的鏈, 不是檔名** ——
# 這個前綴純粹是給人看的, 讓 `ls` 出來的順序跟時間順序一致。
# (舊的自製機制用四位數字編號來決定執行順序, Alembic 不需要那個, 也不要模仿它:
#   兩個人各自建了 0003 時, 數字看起來沒衝突而鏈其實分岔了, Alembic 會直接報
#   multiple heads, 數字編號則會安靜地少跑一支。)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
