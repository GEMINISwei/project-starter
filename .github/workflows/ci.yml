name: CI

on:
  # **push 到 main 只跑 pushed-via-pr 與 publish**，測試那六個 job 全部跳過。
  # 前提是 ruleset 已經匯入（strict：分支必須是最新才能 merge），完整理由與「沒匯入
  # 該怎麼辦」寫在 api job 的註解上。tag push 不受這條影響，照跑全套。
  push:
    branches: [main]
    # 發版走 tag。tag push 也要跑完整套 CI —— publish job 會把 image 推上 registry，
    # 而那份 image 就是要上線的東西，不能只因為「同一個 commit 在 main 上綠過」就跳過。
    # （check-version 在 tag build 時會多驗 tag 與 APP_VERSION 一致，那條只有這裡跑得到。）
    tags: ["v*"]
  pull_request:
    branches: [main]
    # 預設只有 opened／synchronize／reopened。**`ready_for_review` 非加不可**：
    # 有三個 job 在 draft 上是跳過的（deploy-config、e2e、security，各自的理由見那三個
    # job），而「按下 Ready for review」本身不推 commit —— 少了這個事件，CI 不會重跑，
    # 那三個就永遠停在 skipped，而 skipped 對 required status check 算通過。
    # 加上它，那三個才會在「draft → ready」的那一刻於同一個 SHA 上真的跑一次。
    # （pr-checks 裡的驗收條件那一步也靠這個事件補跑，但它是 step 層的跳過，
    # 不會蓋掉 job 的結論 —— 差別寫在那一步的註解上。）
    #
    # 其餘的 job 在這個事件上**照樣重跑**，即使 SHA 沒變。為什麼不省下那一輪，
    # 見 api job 的註解（試過，會讓 PR 頁面說謊）。
    types: [opened, synchronize, reopened, ready_for_review]

  # 手動觸發。**這條的用途是「對當前的 main（或任何分支）重跑一次完整 CI」** ——
  # 沒有它的話，唯一的重跑方式是去 Actions 頁面 re-run 一個舊 run，而那跑的是舊的 SHA，
  # 答不了「現在的 main 是不是綠的」這個問題（merge 那一輪刻意不重跑測試，見 api job）。
  #
  # **只加這一行是不夠的，這是最容易寫錯的地方。** 底下六個測試 job 的 `if` 都只認
  # pull_request 與 tag，不一起放行的話手動觸發會得到一個「所有 job 都 skipped」的空 run。
  # 那個畫面看起來像成功 —— 而它其實什麼都沒驗。六個 job 各自的 `if` 都列了
  # workflow_dispatch，改動時要一起改。
  #
  # pr-checks 刻意**不**放行：它讀的是 PR 標題與描述，手動觸發時沒有 PR context。
  workflow_dispatch:

  # 每週跑一次完整 CI。**這一條存在的理由只有 security job**：它查的是外部 advisory
  # 資料庫，會因為「今天有人公布了新漏洞」而變紅 —— 那跟有沒有人送 PR 無關。
  # 沒有它的話，一個上線後穩定、幾週沒有 PR 的專案就是幾週沒有掃過，
  # 而 dependabot 只在**有更新時**才開 PR，補不上沒有更新的那幾週。
  #
  # 不另外開一支只有 security 的 workflow：那要把 setup 步驟再抄一份，
  # 而整套跑一次的邊際成本很低。
  # **排程實際上只跑 security 一個 job**，其餘全部帶條件跳過（各 job 的註解裡都指回這裡）。
  # 這是刻意的：相依全是釘死的 lock 檔，每週重跑 lint／build／e2e 測不到任何新東西，
  # 而每個 job 都是逐一進位到整分鐘計費的。publish 與 pushed-via-pr 本來就只在 push 上跑。
  schedule:
    - cron: "0 3 * * 1"

# 沒宣告的話吃的是 repo 設定的預設值，而那可能是 read-write。底下的 job 會跑第三方
# action 與 npm／uv 拉下來的程式碼，其中沒有一個需要寫入這個 repo。
# 真的需要更多的那兩個 job（publish 要 packages: write、pushed-via-pr 要
# pull-requests: read）自己宣告 —— job 層的 permissions 是**取代**而不是疊加，
# 所以它們不受這裡影響。
permissions:
  contents: read

# 同一個 PR 連續推送時，取消還在跑的舊 job。
# **tag build 不取消**：那條路徑會推 image 並觸發部署，中途被砍會留下
# 「有些 tag 推上去了、有些沒有」的半套狀態，而 registry 沒有交易可言。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # **只在 PR 與 tag 上跑。** 三種不跑的情況，理由各不相同：
    #
    #   schedule       那條 cron 存在的理由只有 security job（見 `on:` 的註解）——
    #                  相依全是釘死的 lock 檔，每週重跑 ruff／mypy／pytest 測不到任何
    #                  新東西。這正是 e2e 當初被排除的同一個判斷。
    #
    #   push 到 main   **前提是 ruleset 已經匯入**：它的 strict 政策要求「分支必須是最新的
    #                  才能 merge」，所以 PR head 的 tree 就等於 merge 之後的 tree ——
    #                  這一輪重跑的是同一棵樹，零新資訊，而實測要 12 分鐘。
    #                  沒有匯入 ruleset 的話這個推論不成立（main 可能在 PR 開著的時候
    #                  前進），那時候請把這裡改回 `github.event_name != 'schedule'`。
    #                  匯入與否 repo 裡看不到，`make check-ci` 也守不到，見
    #                  docs/development.md 的〈分支保護〉。
    #
    #   draft          **不跳過**，理由見下一段。
    #
    # **不要再加 `github.event.action != 'ready_for_review'`。** 那看起來很划算 ——
    # 按下 Ready 不改變 SHA，這個 job 在 draft 期間已經對同一份 tree 跑綠過了，
    # 重跑只會產出位元組相同的答案，一個功能 PR 省 6 分鐘。**實測過，不行**：
    # ready_for_review 那一輪會在同一個 SHA 上**再開一筆**叫 api 的 check run，
    # 結論是 skipped，而 GitHub 取的是最新那筆 —— draft 期間那筆 success 就被蓋掉，
    # PR 頁面顯示 `api — skipping`。
    #
    # 「跳過」跟「從頭到尾沒跑過」在那個畫面上完全一樣，而 skipped 對 required status
    # check 算通過。等於在最需要看清楚的那一刻（merge 前）把訊號拿掉，
    # 換 6 分鐘不划算。draft 期間跳過 deploy-config、e2e 與 security 是另一回事：
    # 那三個接著就會在 ready_for_review 補跑，最新那筆是真的結果。
    if: >-
      github.event_name == 'pull_request' || github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: 啟動 PostgreSQL
        # image **從 compose 讀出來**，這裡不寫第二份。
        #
        # 寫死的代價不是「跑錯版本」（`make check-compose` 會擋），而是 **dependabot 的
        # 升版 PR 永遠紅燈**：它的 docker_compose 生態系只更新 compose 那一份，看不到
        # `run:` 裡的字串，於是每次升 postgres 都要有人手動往它的分支補一個 commit。
        #
        # 用 `docker run` 而不是 `services:`：後者的 image 必須是字面值，
        # 沒辦法在 job 開始前先算出來。
        #
        # 排在安裝相依之前，讓資料庫開機與 uv sync 重疊；等待就緒在那之後。
        run: |
          # **要用絕對路徑**：這個 job 的 `defaults.run.working-directory` 是 apps/api，
          # 倉庫根目錄在 $GITHUB_WORKSPACE。寫成根目錄的相對路徑在這裡讀不到檔案，
          # 而且底下那個守衛的訊息會指向 compose，看不出是路徑寫錯。
          compose="${GITHUB_WORKSPACE}/infra/docker/docker-compose.yml"
          image="$(grep -oE 'postgres:[0-9]+\.[0-9]+-alpine' "$compose" | head -1)"
          # 抓不到就停。空字串會讓 docker run 去拉一個叫 "" 的 image，
          # 而那個錯誤訊息完全看不出是這裡的 grep 壞了。**訊息要帶上路徑** ——
          # 「找不到 image」與「檔案根本不在這裡」是兩回事。
          [ -n "$image" ] || { echo "在 ${compose} 找不到 postgres image"; exit 1; }
          echo "integration 測試使用 ${image}（來自 compose）"
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            "$image"

      - name: 安裝 uv
        # 釘 SHA 而不是 `@v9`：setup-uv 從 v8.0.0 起刻意不再發布會移動的 major tag
        # （上游的供應鏈防護，理由見他們的 v8.0.0 release notes），`@v9` 解析不到，
        # CI 會在 "Prepare all required actions" 就整個掛掉。旁邊的 actions/* 還有
        # 移動式 tag 可用，所以這個檔案裡兩種寫法並存是刻意的。
        # 版本由 dependabot 的 github-actions 生態系連同註解一起更新。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: 安裝相依套件
        run: uv sync --frozen

      - name: 等待 PostgreSQL 就緒
        # 沒有 `services:` 就沒有 healthcheck，所以「連得上」這件事要自己等 ——
        # 少了這段，第一條測試會撞上 "the database system is starting up"。
        #
        # `-h 127.0.0.1` 是必要的：不帶主機時 pg_isready 走 unix socket，而那個 socket
        # 在 initdb 期間就已經在了，檢查會提早轉綠（同 compose 的 healthcheck）。
        run: |
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U ci -d ci >/dev/null 2>&1 && \
              echo "postgres ready" && exit 0
            sleep 2
          done
          echo "PostgreSQL 未能在時限內接受連線"; exit 1

      - name: Lint（ruff）
        run: uv run ruff check .

      - name: 型別檢查（mypy）
        run: uv run mypy

      - name: 測試
        env:
          PROJECT_NAME: ci
          MODE: development
          POSTGRES_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          JWT_SECRET_KEY: ci_secret_key_that_is_at_least_32_characters
          # integration 測試在連不上 PostgreSQL 時會 `pytest.skip`，而 skip 的 exit code
          # 是 0 —— 資料庫沒起來就整批消失，所有燈照樣是綠的。這個變數讓同樣的情況
          # 變成 fail（見 tests/integration.py）。覆蓋率當不了代理指標：fail_under 刻意
          # 訂到「本機完全沒有 PostgreSQL 也過得了」。
          REQUIRE_INTEGRATION: "1"
        # 帶覆蓋率跑。門檻在 pyproject.toml 的 fail_under（防退步的地板，不是目標）。
        run: uv run pytest tests/ -q --cov

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 條件與理由同 api job。
    if: >-
      github.event_name == 'pull_request' || github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 版本讀 apps/web/.nvmrc，不在這裡再寫一次 —— 三個 job 加上 Dockerfile，
          # 寫死的話有四處可以各自飄。
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安裝相依套件
        run: npm ci

      - name: Lint（eslint）
        run: npm run lint

      - name: 型別檢查（tsc）
        run: npm run typecheck

      - name: 測試（vitest）
        # 門檻在 vitest.config.ts 的 coverage.thresholds。
        run: npm run test:coverage

      - name: 建置
        env:
          # next.config.ts 會在載入時驗證這個值的格式。
          UPLOAD_SIZE_LIMIT: 1mb
        run: npm run build

  # 部署設定的驗證。`make check` 只涵蓋原始碼 —— compose 檔與 production Dockerfile
  # 壞掉時，前面那些 job 全部照樣綠燈，直到有人真的去部署才會發現。
  #
  # 這裡刻意**不**把整套 compose 跑起來（那需要在 CI 裡等 replica set、等 healthcheck，
  # 又慢又不穩）。驗證的是「設定檔語法有效」與「image 建得起來」這兩件會靜靜壞掉的事；
  # 啟動順序的正確性由 depends_on 的宣告保證，另有文件化的手動驗證步驟。
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 三個不跑的情況：
    #
    #   schedule       理由同 api job。
    #
    #   push 到 main   理由同 api job（ruleset 的 strict 政策讓那一輪成為零新資訊）。
    #
    #   draft     **跟 pr-checks 裡驗收條件那一步的理由不同** —— 那邊是「draft 上必定紅」，
    #             這邊是回饋速度與噪音。這是整套裡最貴的 job（實測 4m42s），而它回答的問題
    #             「部署設定壞了沒、image 建不建得起來」只有在準備 merge 的那一刻才需要答案，
    #             draft push 又是整個流程中次數最多的事件 —— 每次推都等它跑完，
    #             換到的是一個你還不會去看的答案。
    #
    #             **這裡原本寫的理由是計費**（免費方案每月 2000 分鐘）。repo 轉成 public
    #             之後分鐘數無限，那個理由沒了，但行為要留著：省的是你的等待時間。
    #             private 專案則兩個理由都成立。
    #
    #             靠 `on:` 的 ready_for_review 在同一個 SHA 上補跑一次。**那個事件
    #             缺一不可**，理由寫在 `on:` 那裡（skipped 對 required check 算通過）。
    #             draft 期間要看這盞紅綠燈就自己跑 `make check-compose`。
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Shell 腳本靜態檢查（shellcheck）
        # 排在最前面：純靜態、不需 docker，而且 `make` 的指令實作全是 shell ——
        # 底下每一步都在跑它們，腳本本身壞掉時最好先知道。ubuntu runner 內建 shellcheck。
        run: make check-shell

      - name: 確認 CI 與本機指令、分支保護三者一致
        # 這一步守的是這份檔案自己：底下 api／web 兩個 job 內嵌的指令是從
        # scripts/{lint,typecheck,test,build}.sh 抄過來的（為了讓兩邊平行跑），
        # 而 .github/rulesets/main.json 又抄了一份 job 名單。三處都是手寫的，
        # 漂移時沒有任何症狀 —— 尤其是 ruleset 少列一個 job，那個 job 就不再擋 merge。
        run: make check-ci

      - name: 確認環境變數四處一致
        # .env.example（清單）、scripts/init.sh（產生 .env）與 compose（注入）都是手寫的，
        # 而沒有任何程式讀 .env.example —— 它寫錯不會讓任何指令失敗，只會讓照著清單
        # 設定的人踩坑。同樣是純靜態檢查，不需要 docker，所以排在建置那幾步之前。
        run: make check-env

      - name: 確認 APP_VERSION 與 CHANGELOG（發版時還有 git tag）一致
        # 在這支之前 APP_VERSION 沒有任何檢查器 —— 而 registry 模式讓它從紀律問題
        # 變成正確性問題：image 以 git tag 命名，image 裡的 OpenAPI 卻印 APP_VERSION。
        run: make check-version

      - name: 確認文件指向的檔案與識別字存在
        # 沒有任何一個既有 job 會讀 markdown，所以文件教錯一個 API 可以綠燈到永遠 ——
        # 而照抄的人一定編不過。同樣是純靜態、不需 docker，排在建置那幾步之前。
        run: make check-docs

      - name: 建立驗證用的 .env
        # compose 的變數大量使用 ${VAR:?}（缺少即中止），所以 config 驗證需要一份完整的
        # 環境變數。這些值只用來讓變數插值成立，不會真的啟動任何服務。
        #
        # **金鑰那一欄不寫死，每次現產一把。** 寫死的話那串 base64 會被泛型的 secret
        # 掃描器（GitGuardian 這類）判成外洩的金鑰 —— 值是假的，但這是個模板，
        # 那串字會被**每一個下游繼承**，於是每個 clone 出去的專案都收到同一封誤報。
        # 這裡只是要讓 compose 的 `${VAR:?}` 插值成立，現產一把最省事。
        run: |
          key="$(openssl rand -base64 32)"
          cat > .env <<'ENVEOF'
          COMPOSE_PROJECT_NAME=ci
          SYSTEM_NAME=CI
          SYSTEM_PORT=3000
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-password
          POSTGRES_DB=ci
          JWT_SECRET_KEY=ci_secret_key_that_is_at_least_32_characters
          EXPIRE_HOURS=8
          TOKEN_VERSION=1
          REGISTER_KEY=
          UPLOAD_SIZE_LIMIT=1mb
          VAPID_PRIVATE_KEY=ci
          VAPID_PUBLIC_KEY=ci
          VAPID_SUBJECT=mailto:ci@example.com
          ENVEOF
          # 結束標記加引號 = 整段不做任何展開，每個值照字面寫進去（密碼那類欄位含 `$`
          # 或反引號時才不會被 shell 吃掉）。所以現產的那一欄補不進去，只能在外面加一行。
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${key}" >> .env

      - name: 驗證 compose 設定（語法、相對路徑、migrate 順序）
        # 三件事都由這一支守。**不要在這裡手拼 compose 旗標** ——
        # `--project-directory` 與 `--env-file` 的基準不同，組錯時 docker 不會報錯，
        # 而唯一一份正確組合在 scripts/lib/compose.sh —— 那個檔案的檔頭就寫著
        # 「這裡是唯一來源，不要在別處再組一份」。
        run: make check-compose

      - name: 確認 nginx 每個 proxy location 都覆寫用戶端 IP
        # 後端的限流無條件信任 X-Real-IP，正確性完全建立在 nginx 會覆寫它上面。
        # 漏掉一個 location block 是靜默的：所有人共用同一個限流 key，沒有任何錯誤訊息。
        run: make check-nginx

      # 以下兩個 image 建置改走 buildx 並把 layer 快取寫進 GitHub Actions cache，
      # 讓後面的 publish job 直接命中 —— 否則同一個 commit 的同一份 image 會建兩次。
      - uses: docker/setup-buildx-action@v4

      - name: 建置 api production image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          target: base
          tags: api-image-check
          # `load: true` 才會把結果放進本機 docker daemon，下一步的 docker run 需要它。
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: 確認備份工具在 image 裡跑得起來
        # pg_dump／pg_restore 是額外裝進 image 的（見 apps/api/Dockerfile），
        # 缺少動態連結相依時 image 照樣建得起來、服務照常跑，只有 `make backup` 會炸。
        # 這一步把它變成建置階段就會紅的錯。
        run: |
          docker run --rm api-image-check pg_dump --version
          docker run --rm api-image-check pg_restore --version

      - name: 建置 web production image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          target: prod
          tags: web-image-check
          # build arg 只剩這一個：SYSTEM_NAME／EXPIRE_HOURS／VAPID_PUBLIC_KEY 都已經
          # 改成執行期注入（見 apps/web/shared/runtime/config.ts）。
          build-args: UPLOAD_SIZE_LIMIT=1mb
          # `load: true` 才會把結果放進本機 docker daemon，下一步的 docker run 需要它
          # （同上面的 api image）。buildx 預設不 load，而症狀是 docker run 說找不到
          # 那個 tag —— 看起來像上一步沒建成功。
          load: true
          # **沒有 build secret 了。** Server Action 的 id salt 現在是 Dockerfile 裡的
          # 公開常數，金鑰改由執行期注入 —— 理由見 apps/web/Dockerfile 的長註解。
          #
          # scope 與 publish 分開的理由也跟著消失了（原本是怕假金鑰經由共用快取被烤進
          # 正式 image，而 BuildKit 的 cache key 不含 secret 值）。**還是不要合併** ——
          # 這一步 build 的是丟棄用的檢查 image，跟 publish 的產物沒有共用的必要，
          # 分開比較好推理誰污染了誰。
          cache-from: type=gha,scope=web-check
          cache-to: type=gha,scope=web-check,mode=max

      - name: 確認 web image 沒有把金鑰烤進去
        # 守的不變條件：image 裡的 encryptionKey 必須是 Dockerfile 那個**公開常數**。
        # 不是的話代表有人又把真金鑰接回 build 期（改 Dockerfile、加 build secret、
        # 或設了 NEXT_SERVER_ACTIONS_ENCRYPTION_KEY 環境變數讓 next build 讀到），
        # 而那個失敗**完全沒有症狀** —— image 建得起來、服務跑得動，只是秘密跟著 image 走。
        #
        # **為什麼不用通用的 secret 掃描器**：實測過 trivy 的 secret scanner，
        # 對真的含金鑰的舊 image 掃出 0 筆，對只含那份 manifest 的對照組也是 0 筆 ——
        # 它的規則庫不認「JSON 欄位裡的一串 base64」。加一個守不到的檢查比沒有更糟，
        # 所以這裡改成針對性的斷言：我們知道那個值該是什麼，就直接比對。
        #
        # 常數從 Dockerfile 讀，不在這裡抄第二份（比照上面 postgres image 從 compose 讀）。
        run: |
          expected="$(sed -n 's/^ARG NEXT_ACTIONS_ID_SALT="\(.*\)"$/\1/p' apps/web/Dockerfile)"
          # 抓不到就停。空字串會讓底下的比對變成「跟空字串比」，而那會在真的有金鑰時放行。
          [ -n "${expected}" ] || {
            echo "::error::在 apps/web/Dockerfile 找不到 ARG NEXT_ACTIONS_ID_SALT=\"...\"。"
            echo "::error::這個檢查靠它當基準，改了那一行就要一起改這裡的 sed。"
            exit 1
          }

          actual="$(docker run --rm --entrypoint node web-image-check -e '
            const fs = require("fs")
            const p = "/app/.next/server/server-reference-manifest.json"
            if (!fs.existsSync(p)) process.exit(3)
            process.stdout.write(String(JSON.parse(fs.readFileSync(p, "utf8")).encryptionKey ?? ""))
          ')" || {
            echo "::error::讀不到 image 裡的 server-reference-manifest.json。"
            echo "::error::Next 換了產物路徑的話這個檢查會靜靜失效，所以這裡當成失敗處理。"
            exit 1
          }

          # **不要把 actual 印出來** —— 不一致時它就是那個不該外流的值。
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::web image 裡的 encryptionKey 不是 Dockerfile 的公開常數。"
            echo "::error::代表有東西把真金鑰接回 build 期了，那會讓秘密跟著 image 散出去。"
            echo "::error::理由與正確作法見 apps/web/Dockerfile 的長註解。（值刻意不印出來。）"
            exit 1
          fi
          echo "OK: image 裡只有公開的 id salt"

  # 三件 PR-only 的紀律檢查，合在同一個 job 裡。
  #
  # **為什麼合併**：三個各自只跑 4～6 秒，而 GitHub 是**逐 job 進位到整分鐘**計費的 ——
  # 拆開的帳單是 3 分鐘，合起來是 1 分鐘，而多付的三分之二買到的是 job 的啟動，
  # 不是任何檢查。一輪 PR 的實測是 7 分鐘的工作、14 分鐘的帳單，這三支就佔了其中 3 分。
  #
  # **這推翻了原本「不跟 changelog 併成一個 job」的決定。** 那段理由是「兩者的放行條件
  # 不同，併起來之後『這個 PR 為什麼綠燈』會取決於兩組規則的交互」—— 顧慮本身成立，
  # 但當初沒把計費算進去。折衷是**三個檢查各自一個 step**，各自保留自己的逃生門與訊息：
  # PR 頁面上只剩一盞燈，但點進去是哪一步紅的一目了然，交互也還是三條各自獨立的規則。
  #
  # 只在 pull_request 觸發：三個都要讀 PR 描述或跟 base 比對，push 上兩者都沒有。
  # checkout 只做一次，`fetch-depth: 0` 是 changelog 與 test-edits 共同的需求
  # （淺 clone 找不到 merge-base，而 test-edits 找不到時是**跳過**不是失敗 ——
  # 那會讓它靜靜地什麼都沒驗）。
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CHANGELOG 的守衛：動到 apps/、scripts/ 或 infra/ 卻沒留條目就失敗。
      #
      # 漏寫沒有任何症狀 —— 程式碼照樣合進去，只是「這個版本改了什麼」少了一筆，
      # 而那要到有人回頭追某個行為是什麼時候變的才會發現。
      #
      # **用這個模板開出來的專案可以把這一步刪掉**，如果你的發布紀律不一樣的話。
      - name: 實質改動有留下 CHANGELOG 條目
        env:
          # 用 base ref 而不是寫死 main：日後開 release 分支時這個 job 不必跟著改。
          BASE_REF: ${{ github.base_ref }}
          # 一律經由 env 傳入，**不要內插進 run 的腳本字串**：標題與描述是任何人都能
          # 編輯的內容，內插等於讓 PR 作者在 runner 上執行任意指令。底下兩步同理。
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 放行方式：PR 標題帶 [skip changelog]。純重構、CI 調整這類不影響行為的改動
          # 不該被卡住 —— 但要**明講**，而不是預設放行。
          case "$PR_TITLE" in
            *"[skip changelog]"*)
              echo "PR 標題帶 [skip changelog]，略過檢查"
              exit 0
              ;;
          esac

          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)

          # 只看這三個目錄。文件與 .github/ 自己的改動不需要條目。
          if ! echo "$changed" | grep -qE '^(apps|scripts|infra)/'; then
            echo "沒有動到 apps/、scripts/ 或 infra/，不需要 CHANGELOG 條目"
            exit 0
          fi

          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "OK: 實質改動已附上 CHANGELOG 條目"
            exit 0
          fi

          echo "::error::這個 PR 動到 apps/、scripts/ 或 infra/，但沒有更新 CHANGELOG.md。"
          echo "::error::請補一筆條目說明改了什麼（格式見 CHANGELOG.md 檔頭）。"
          echo "::error::純重構或不影響行為時，在 PR 標題加上 [skip changelog]。"
          exit 1

      # 功能級規格那一層的檢查器（見 docs/development.md 的「規格與測試的三層」）。
      #
      # **draft 上不跑。** 流程是先開 draft PR 寫驗收條件、再寫測試，所以它在 draft 期間
      # 必定是紅的 —— 而 draft PR 本來就 merge 不進去，那個紅燈擋不到任何東西，只會讓
      # checks 清單上「預期中的紅」與「真的壞了」長得一模一樣。這是整套 CI 裡唯一一處
      # 紅燈不代表有事的地方，所以拿掉。代價是驗收條件的紅綠燈要自己跑
      # `make check-acceptance`（它讀得到當前分支的 PR），換來的是 PR 頁面上的紅一律代表有事。
      #
      # **這裡是 step 層的 if，跟 job 層的跳過不是同一件事**：這一步被跳過時整個
      # pr-checks 仍然是 success，所以不會出現「skipped 蓋掉 success」的問題
      # （那個問題與實測見 api job 的註解）。job 層則靠 `on:` 的 ready_for_review
      # 讓整支在按下 Ready 的那一刻於同一個 SHA 上重跑一次。
      - name: 每條驗收條件都指得出一個存在的測試
        if: '!github.event.pull_request.draft'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make check-acceptance

      # 實作級規格的防線：改動或刪掉既有測試時，要求 PR 描述說明為什麼。
      - name: 改動到既有測試時有說明
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make check-test-edits

  # 跨層 e2e。**這是唯一會把整套服務真的跑起來的 job** —— deploy-config 只驗設定與
  # 建置得起來，api/web 兩個 job 只跑單層測試。
  #
  # 它守的是四條「兩邊各自都測過、中間沒人測」的接縫（清單見 e2e/tests/ 的檔頭）。
  # 不在 make check 裡：check 涵蓋原始碼而且要能離線快跑，這一支要起整套 compose。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 排程觸發時不跑。那條 cron 存在的理由只有 security job（它查的是會自己變紅的外部
    # advisory 資料庫）—— e2e 的相依全部釘死，每週跑一次測不到任何新東西，只是燒時間。
    #
    # draft 期間也不跑，理由同 deploy-config job：計費，而且它回答的問題只有在準備
    # merge 那一刻才需要答案。同樣靠 `on:` 的 ready_for_review 在同一個 SHA 上補跑。
    # draft 期間要看這盞紅綠燈就自己跑 `make e2e`。
    #
    # push 到 main 也不跑，理由同 api job。**tag 照跑** —— 那份 image 要上線。
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 版本線同其他 job，讀 apps/web/.nvmrc（e2e 沒有自己的 .nvmrc，
          # 多一份版本號就多一個會各自飄的地方）。
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 建立 .env
        # 值只要讓 compose 的 ${VAR:?} 插值成立即可，**但這個 job 會真的把資料庫跑起來**，
        # 所以有兩個欄位不能隨便填：
        #
        #   REGISTER_KEY      不能留空 —— 第一條接縫就是拿它建立第一個超級管理者。
        #                     空的話那條會失敗，而症狀是「註冊表單送不出去」。
        #   POSTGRES_PASSWORD **不可以含 `@` `:` `/` `?` `#`**。它會被插進 compose 組出來的
        #                     `postgresql+asyncpg://user:pass@postgres:5432/db`，那些字元
        #                     會把 URL 切在錯的地方 —— 症狀是 api 一直重啟並說認證失敗，
        #                     完全看不出跟密碼裡的字元有關。`scripts/init.sh` 對這個欄位
        #                     的字元集限制是同一件事。
        #
        # 金鑰那一欄現產，理由同 deploy-config 的「建立驗證用的 .env」那步。
        run: |
          key="$(openssl rand -base64 32)"
          cat > .env <<'ENVEOF'
          COMPOSE_PROJECT_NAME=e2e
          SYSTEM_NAME=E2E
          SYSTEM_PORT=3100
          POSTGRES_USER=e2e
          POSTGRES_PASSWORD=e2e-password
          POSTGRES_DB=e2e
          JWT_SECRET_KEY=e2e_secret_key_that_is_at_least_32_characters
          EXPIRE_HOURS=8
          TOKEN_VERSION=1
          REGISTER_KEY=e2e-register-key
          UPLOAD_SIZE_LIMIT=1mb
          VAPID_PRIVATE_KEY=e2e
          VAPID_PUBLIC_KEY=e2e
          VAPID_SUBJECT=mailto:e2e@example.com
          ENVEOF
          # heredoc 整段不展開（理由同 deploy-config 那步），所以這一欄在外面補。
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${key}" >> .env

      - name: 跑 e2e
        run: make e2e

      - name: 失敗時留下報告、trace 與容器 log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          # 三份東西，缺一不可：
          #   playwright-report/  html 報告（哪一條失敗、每一步的細節）
          #   test-results/       trace 與截圖，**以及 scripts/e2e.sh 在失敗時倒進去的
          #                       容器 log** —— stack 起不來的時候，前兩份都是空的，
          #                       只有 log 講得出原因
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # 事後偵測「沒經過 PR 就進了 main」。
  #
  # 這一段本來該由 GitHub 的分支保護處理，而 ruleset 匯入之後它確實是（見
  # docs/development.md 的〈分支保護〉）。這個 job 是**第三層**，存在的理由是
  # ruleset 不一定在：對 private repo 它要付費方案（免費方案連 API 都回 403），
  # 而且「JSON 有沒有真的匯入 GitHub」repo 裡看不到，沒有任何檢查器守得到。
  # 三層是：ruleset 在伺服器端擋，.githooks/pre-push 在本機擋，這個 job 在事後吵。
  #
  # **它擋不住任何東西** —— 走到這裡東西已經在 main 上了。它的價值是留下一筆紅燈紀錄，
  # 並涵蓋 hook 管不到的情況：沒跑過 `make setup` 的機器、`--no-verify`、
  # 以及直接在 GitHub 網頁上編輯檔案。
  #
  # 順帶救回 pr-checks：那一個只在 pull_request 上跑，繞過 PR 等於繞過它，
  # 而 CHANGELOG.md 是「這個版本改了什麼」的唯一紀錄。
  #
  # 只在 push 到 main 時跑，所以**不能列進 .github/rulesets/main.json 的必要檢查** ——
  # PR 上它根本不存在，列進去每個 PR 都會卡在等一個不會來的檢查（同 publish）。
  # check-ci 守著這件事。
  pushed-via-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `!github.event.created` 排除掉「建立 main 的那一次 push」—— 那時候 repo 才剛開，
    # 不可能有 PR。少了它，每個新專案的第一筆 CI 紀錄都是紅的，而那會教會人
    # 「這個 job 紅是正常的」—— 一個註定被忽略的紅燈，等於這個 job 不存在。
    #
    # 用 created 而不是「排除 root commit」，因為開案有兩條路徑（見 TEMPLATE.md）：
    # 不保留歷史時 tip 就是 root commit，保留歷史時 tip 是模板的某個 commit ——
    # 後者用 root commit 判斷會漏掉，而 PR 關聯是 per-repo 的，那個 commit 在新 repo
    # 裡一樣查不到 PR。
    #
    # **已知的洞**：刪掉 main 再重推也會讓 created 是 true。這個洞可以接受 ——
    # 做得出那件事的人已經越過比繞過 PR 嚴重得多的線，而刪除本來就由 pre-push hook
    # 與 ruleset 的 deletion 規則管，不是這個 job 的守備範圍。
    if: >-
      github.event_name == 'push' && github.ref_name == 'main'
      && !github.event.created
    permissions:
      contents: read
      # 查這個 commit 關聯到哪些 PR。private repo 少了它是 403，而 403 在
      # `run:` 的預設 bash -e 下會讓這一步當場失敗 —— 那是要的行為，不要改成放行。
      pull-requests: read
    steps:
      - name: 確認這個 commit 是從 PR 合進來的
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 commit → PR 的反查，而不是看 commit message 是不是 "Merge pull request"：
          # squash 與 rebase 合併都不會產生那種訊息，用訊息判斷會把正常流程判成違規。
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "OK: 這個 commit 來自 PR"
            exit 0
          fi

          echo "::error::commit $GITHUB_SHA 直接進了 main，沒有經過 PR。"
          echo "::error::CI 的 pr-checks 只在 PR 上跑，這次等於繞過了它。"
          echo "::error::本機的 .githooks/pre-push 會擋這件事；沒被擋下來代表那台機器"
          echo "::error::沒跑過 make setup，或用了 --no-verify，或是在網頁上直接編輯。"
          exit 1

  # 相依套件的已知漏洞掃描。獨立成一個 job 而不是掛在 api/web 後面，理由有二：
  #   1. 它查的是外部 advisory 資料庫，會因為「今天有人公布了新漏洞」而變紅 —— 那跟這個 PR
  #      改了什麼無關，混在程式碼的 job 裡會讓人分不清是自己弄壞的還是外面變了。
  #   2. 它需要網路，而 `make check` 刻意保持可離線執行（見 scripts/audit.sh 的檔頭註解）。
  #
  # **draft 上不跑**：它查的資料庫一天最多變一次，而 draft push 是整個流程裡次數最多的
  # 事件 —— 每次推都問一次同一個外部資料庫，得到的是同一個答案。按下 Ready 時補跑一次，
  # 每週一的 cron 再跑一次，這兩個才是它真正的落點。
  #
  # push 到 main 也不跑，理由同 api job。**schedule 與 tag 都要跑**：前者是這個 job
  # 存在的理由，後者是要上線的東西。
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v7
        with:
          # 版本讀 apps/web/.nvmrc，不在這裡再寫一次 —— 三個 job 加上 Dockerfile，
          # 寫死的話有四處可以各自飄。
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安裝相依套件（前端）
        run: npm ci
        working-directory: apps/web

      - name: 稽核正式環境相依
        run: make audit

  # 前端型別是從後端 OpenAPI 產生的。這個 job 重新產生一次再比對 git diff，
  # 確保有人改了 schema.py 卻忘記跑 `make gen-types` 時 CI 會擋下來 ——
  # 沒有這一步，型別契約就只是「建議」而不是保證。
  api-types-up-to-date:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 條件與理由同 api job。
    if: >-
      github.event_name == 'pull_request' || github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v7
        with:
          # 版本讀 apps/web/.nvmrc，不在這裡再寫一次 —— 三個 job 加上 Dockerfile，
          # 寫死的話有四處可以各自飄。
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: uv sync --frozen
        working-directory: apps/api

      - run: npm ci
        working-directory: apps/web

      - name: 重新產生型別
        run: make gen-types

      - name: 檢查 API 契約與前端型別是否為最新
        run: |
          if ! git diff --exit-code -- contracts/openapi.json apps/web/shared/api/generated/schema.d.ts; then
            echo "::error::contracts/openapi.json 或 apps/web/shared/api/generated/schema.d.ts 已過期。請在本機執行 'make gen-types' 並把兩份結果一併 commit。"
            exit 1
          fi

  # 把驗過的 image 推上 GHCR。這是 CI 與 CD 的交界：從這裡之後，「上線的東西」
  # 就是這個 job 產出的那份 digest，不再是任何人在某台主機上重建的近似品。
  #
  # 放在 ci.yml 而不是獨立 workflow：`needs` 是唯一能保證「全綠才發布」的機制。
  # 拆成兩個 workflow 就得靠 workflow_run 去查另一個 workflow 的結論，
  # 而那條路對「哪一次 run 對應哪一個 commit」的處理很容易寫出漏洞。
  #
  # **下游沒有要用 registry 的話，可以整個刪掉這個 job**（連同 deploy.yml）——
  # `make prod` 那條本機建置的路徑完全不依賴它。
  # ── draft 期間跳過的那三個，PR 一旦 ready 就必須真的跑過 ──────────────────
  #
  # **這個 job 存在的理由是：`ready_for_review` 的補跑機制會被 race 掉，而且沒有紅燈。**
  #
  # 機制本身沒問題（單獨按 ready 時新的 run 會建立、三個 job 真的執行），
  # 壞的是它跟 push 撞在一起的時候 —— 而那不是罕見操作，腳本化的流程就是
  # `git push` 接著 `gh pr ready`（AGENTS.md 規定的 draft PR 流程正是如此）。
  # 實測過**兩種**壞法，成因不同但結果一樣：
  #
  #   PR #14  兩個 run 都建立了，被 concurrency 互砍掉一個（活下來的是 push 那個，
  #           它啟動時 PR 還是 draft）
  #   PR #15  第二個 run **壓根沒有被建立**
  #
  # 兩種都讓那三個 job 停在 skipped，而 **skipped 對 required status check 算通過** ——
  # PR 頁面是綠的、mergeStateStatus 是 CLEAN，看不出它們從來沒跑過。
  #
  # 所以這裡不去修 race（成因不只一種，修一種不夠），改成**檢查結果**：
  # 不管為什麼跳過，PR 已經 ready 卻還是 skipped 就紅燈。
  #
  # **要問「現在」的 draft 狀態，不能看事件 payload。** payload 記的是事件發生當下的
  # 狀態，而這個 job 要擋的正是「事件發生時還是 draft、之後才 ready」那條路徑 ——
  # 讀 payload 的話它會跟著一起被騙過去。
  #
  # 殘留的窗口：ready 按得比這個 job 執行還晚、而且那次 ready 又剛好沒生出 run。
  # 前者要幾十秒、後者只在與 push 相撞時發生，兩者同時成立的組合實務上碰不到。
  draft-gated-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-config, e2e, security]
    # always()：三個 needs 在 draft 上是 skipped，不寫的話這個 job 會跟著 skip，
    # 而那正好是它要偵測的狀態。
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 確認三個 job 真的在這個 commit 上跑過
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # 用 env 傳，不要內插進 run: 的腳本字串 —— 比照 pr-checks 的作法。
          RESULT_DEPLOY_CONFIG: ${{ needs.deploy-config.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
        run: |
          results="deploy-config=${RESULT_DEPLOY_CONFIG} e2e=${RESULT_E2E} security=${RESULT_SECURITY}"

          draft="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq .isDraft)"
          if [ "$draft" = "true" ]; then
            echo "PR 仍是 draft，這三個跳過是預期的：${results}"
            exit 0
          fi

          skipped=""
          for pair in $results; do
            case "$pair" in
              *=skipped) skipped="${skipped} ${pair%%=*}" ;;
            esac
          done

          if [ -n "$skipped" ]; then
            echo "::error::PR 已經 ready，但這些 job 從來沒有在這個 commit 上跑過：${skipped}"
            echo "::error::多半是 push 與「按下 Ready for review」撞在一起，補跑的那個 run 沒生出來。"
            echo "::error::推一個 commit（空的也行）重新觸發即可：git commit --allow-empty -m 'ci: 重新觸發' && git push"
            exit 1
          fi

          echo "三個 job 都在這個 commit 上跑過：${results}"

  publish:
    needs: [api, web, deploy-config, security, api-types-up-to-date, e2e]
    # PR 不推 image：fork 來的 PR 拿不到 packages: write，而且未經審查的分支
    # 本來就不該產出可部署的產物。pr-checks 刻意不列進 needs —— 它是 PR-only，
    # 在 push 上是 skipped。
    #
    # **`always()` 非有不可，而且它是這個 job 最容易寫錯的地方。** needs 裡那六個現在
    # 只在 tag 上跑（見它們各自的註解），push 到 main 時全部是 skipped ——
    # 而 needs 一個 skipped 的 job，預設會讓這裡也跟著 skip，`if` 根本不會被求值。
    # `always()` 讓 if 照樣求值，後面兩條 contains 再把「真的失敗或被取消」擋掉。
    # 少了 always()，症狀是 main 上永遠不再推 image，而且 publish 顯示 skipped，
    # 看起來像設定正確。
    #
    # 兩種觸發路徑因此有不同的保證，要分清楚：
    #
    #   tag    六個 job 都真的在這個 commit 上跑過，全綠才走到這裡。那份 image 要上線。
    #
    #   main   六個都是 skipped。這份 image 的證據來自「同一棵 tree 在 PR 上綠過」，
    #          而那個等式由 ruleset 的 strict 政策撐住（分支必須是最新才能 merge）。
    #          **這是推論，不是在這個 commit 上的觀測** —— 換來的是每次 merge 少 12 分鐘。
    #          不接受這個推論的話，把 needs 那六個的 `if` 改回 `!= 'schedule'` 即可。
    if: >-
      always() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # 底下兩個 attest 步驟要的：id-token 用來跟 Sigstore 換一張這次 run 的短期憑證，
      # attestations 用來把簽好的證明寫回這個 repo 的 attestation store。
      # 兩個都是**寫入**權限，所以刻意留在這個 job 而不是提到檔案層的 permissions ——
      # 那裡是 contents: read，其餘 job 一個都不需要這些。
      id-token: write
      attestations: write
    env:
      # **`sha-<short>` 的長度是跨檔案的契約，所以釘死而不是靠預設值。**
      # `deploy.yml` 由 commit SHA 推導要部署的 image tag（取前 N 碼），兩邊對不上的話
      # 症狀是部署時 pull 不到 tag —— 看起來像 registry 壞掉。
      #
      # metadata-action 的預設**動過**：PR #467 一度改成 12「for uniqueness」，
      # v5.6.1 又改回 7。也就是說「兩邊剛好都用預設」是一個會被上游改掉的巧合，
      # 而它壞掉的時機是下一次部署，不是升級 action 的當下。
      #
      # 要改長度的話：這裡與 deploy.yml 決定 image tag 那一步要一起改。
      DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 內建 token 就夠，不必開 PAT。權限由上面的 `packages: write` 給。
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 讀取 APP_VERSION
        # image 的 version label 用 APP_VERSION 而不是 git tag：tag 只有發版時才有，
        # 而 main 上的每一份 image 也該說得出自己是哪一版。
        # 兩者一致由 deploy-config 的 check-version 保證。
        id: version
        run: |
          version="$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' apps/api/app/config.py)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # tag 規則對兩個 image 都一樣：
      #   push main → `main` + `sha-<short>`
      #   push v1.2.3 → `1.2.3` + `1.2` + `latest`
      # `sha-*` 是唯一一定存在、且一定唯一的那個 —— 部署與回滾優先用它。
      #
      # `flavor: latest=auto` 就是 metadata-action 的預設值，明寫出來是因為 `latest`
      # 已經被 docs/operations.md 當成承諾寫進文件了 —— 被文件承諾的行為不該靠 action
      # 的預設值成立，那種東西升一次 major 就可能改掉，而症狀是「某一版沒有 latest」。
      - uses: docker/metadata-action@v6
        id: meta-api
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/metadata-action@v6
        id: meta-web
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: 建置並推送 api image
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          target: base
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          # **明寫關掉，不要吃預設值。** build-push-action 從 v6 起，push 時預設會掛上
          # min 模式的 inline provenance —— 也就是說「推上去的是純 image」這句話在
          # 什麼都不寫的情況下是**錯的**，而且不看 buildx 指令列看不出來。
          # 要做來源證明的話請改成 mode=max 並在 operations.md 一起改掉說法；
          # 這裡選 false 是為了讓文件裡那條「刻意沒有做」名副其實。
          provenance: false
          # scope 與 deploy-config 那步相同，所以這裡通常是全快取命中。
          cache-from: type=gha,scope=api

      - name: 建置並推送 web image
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          target: prod
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          # 唯一的 build 期設定。用 repository variable 而不是寫死：它必須與部署主機
          # .env 的 UPLOAD_SIZE_LIMIT 相同，不同的話 web 會在啟動時印出原因並結束行程
          # （apps/web/instrumentation.ts）—— 那是刻意的，見 docs/operations.md。
          build-args: UPLOAD_SIZE_LIMIT=${{ vars.UPLOAD_SIZE_LIMIT || '1mb' }}
          # 理由同 api 那步：預設會掛上 inline provenance，不寫就跟文件對不起來。
          provenance: false
          # **這裡刻意沒有任何 cache 設定，api 那邊有。**
          #
          # BuildKit 的 cache key 不包含 secret 的**值**（那是它的設計，避免祕密進到
          # 快取的中繼資料）。所以只要這個 build 讀得到別的 build 留下的快取，
          # `npm run build` 那層就會直接命中 —— secret 掛載根本不會被求值，
          # `required=true` 與 Dockerfile 的空值檢查兩道關卡一起失效，
          # 而烤進 image 的是**當初建立那層快取時用的金鑰**。
          #
          # 那個壞法完全沒有症狀：build 綠燈、image 推得出去、服務跑得起來，
          # 只有金鑰是錯的。每次重建的那兩三分鐘，換的是「發布出去的 image
          # 一定用當下的 secret 建成」。

      # ── build provenance attestation ──────────────────────────────────────
      #
      # **這補的是 deploy.yml 信任鏈裡唯一一段靠推論撐著的地方。** 那份 workflow 等 CI
      # 綠燈、篩 event == push，然後在主機上 pull `sha-<short>` —— 但「這個 tag 指向的
      # image 真的是那次 run 建出來的」原本沒有任何東西在驗。tag 是可以被重指的，
      # 任何拿得到 packages: write 的東西都能覆蓋它，而覆蓋之後 CI 仍然是綠的。
      #
      # **跟 `provenance: false` 不衝突，那兩件事是分開的。** 那一行關的是 buildx 塞進
      # image manifest 的 inline provenance（理由見上面兩個建置步驟的註解，
      # 以及 docs/operations.md）；這裡產生的證明存在 Sigstore 的 transparency log，
      # image 本身仍然是純 image。所以原本那個決定與它的敘述都不必改。
      #
      # 主體是 **digest 不是 tag**，所以一份證明涵蓋這次推出去的每一個 tag
      # （main / sha-xxx / 1.2.3 / latest 全部指向同一份 digest）。
      #
      # 驗證方式（主機上或任何地方）。**兩半的大小寫規則相反**：`oci://` 那一半是 OCI
      # 的 repository name，規格要求全小寫；`--repo` 那一半要維持帳號原本的大小寫。
      # 帳號名含大寫時寫成一樣會被擋下來，而訊息看起來像 image 不存在 ——
      # 完整說明見 docs/operations.md，那一節是這個主題的 owner。
      #   gh attestation verify oci://ghcr.io/acme-corp/my-project/api:main --repo Acme-Corp/my-project
      - name: 產生 api image 的 build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          # 同時以 OCI referrer 的形式推回 GHCR。沒有它證明只存在 Sigstore 那一側，
          # 而離線或受限網路的主機驗不到 —— 而那正是自架主機常見的狀態。
          push-to-registry: true

      - name: 產生 web image 的 build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/web
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true

      - name: 印出這次推出去的 tag
        # 部署時要貼哪個字串，直接從這裡複製，不必去 registry 翻。
        run: |
          {
            echo "### 已發布"
            echo '```'
            echo "${{ steps.meta-api.outputs.tags }}"
            echo "${{ steps.meta-web.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
