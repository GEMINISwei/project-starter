name: CI

# 每個檢查項目各自一個 job、平行跑, 跑的就是本機的 `make check <項目>`, CI 不另寫一份流程:
#   lint             ruff + import-linter + eslint + dependency-cruiser + knip + shellcheck + compose 檔
#   contract         重產契約與前端型別, 不能跟 repo 裡的不一致
#   migrate          已發版的 migration 沒有被修改或刪除
#   types            mypy + tsc
#   web-test         vitest
#   build            前端 production build, 並確認 Next 有認到 proxy.ts
#   api-test         不需要資料庫的後端測試 (平行, 覆蓋率門檻在這裡)
#   api-integration  拋棄式 PostgreSQL 跑 integration 測試 + alembic check
#   e2e              拋棄式的正式環境 + Playwright (依 matrix 分份), 且 web image 裡沒有真的 Server Action 金鑰
#
# ci-gate 等全部 job 跑完再判定 (.github/scripts/ci-gate.sh)。main 的 ruleset 只要求 ci-gate 與 pr.yml
# 的 pr: 新增或改名 job 不必回頭改 ruleset, 但 ci-gate 的 needs 要涵蓋全部 job (測試擋),
# 沒被它等到的 job 紅了照樣能合併。
#
# changes 判斷模式 (.github/scripts/ci-mode.sh): PR 只改了 Markdown 時是 docs, 只跑 api-test 與 web-test
# (文件的連結與格式檢查在裡面), 其餘 job 只在 full 跑。push main 與 workflow_call 一律 full。
#
# 不能手動執行: main 上的 run 失敗用 rerun 重跑; main 的 commit 沒有 CI 結果時, 部署會自己跑一次。
# 不用 workflow 層級的 paths-ignore: 整份被跳過時 required check 不會回報, PR 會一直等。
#
# 例外是 e2e 的 image: 先用 gha 快取建好再交給 make check e2e, 不讓它在沒有快取的 runner 上重建。
# 建法與 deploy.yml 的 build 相同 (target、快取 scope), 測的與部署的是同一份建置設定。
#
# deploy.yml 以 workflow_call 重用整份: 要部署的 commit 要先通過同一套檢查。它傳 `ref`
# 指定那個 tag —— 手動觸發時 github.ref 是 main, 不傳的話測的會是 main 而不是要部署的版本。
# 所以每個 checkout 都帶 `ref: ${{ inputs.ref }}` (測試擋)。
#
# timeout 訂得比平常的執行時間寬幾倍就好: 卡住的 job 越早失敗, 修正的人越早拿到結果。
#
# action 的版本: GitHub (actions/*) 與 Docker (docker/*) 官方的用 tag, 第三方的釘 commit SHA
# —— tag 可以被改指向, 第三方的 tag 被改等於把任意程式碼放進 CI。有漏洞時由 Dependabot 開安全更新, 其餘在整批升級時手動升。
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

# 只取消 PR 上的舊 run: 舊 commit 的結果已經沒有意義。main 上連續合併時若取消, 前一個 commit
# 就永遠沒有 CI 結果, 之後紅燈分不出是誰造成、也沒有綠燈可當部署依據, 所以讓它排隊跑完。
# 同一群組最多一個在跑、一個在等, 三個以上連續合併時等待中的仍會被取代。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 前端的 job 都快取 `apps/web/node_modules`: setup-node 的 npm 快取只存下載檔, npm ci 仍要整個重裝。
# key 涵蓋 Node 版本與兩份清單: 少了 .nvmrc 會沿用另一版 Node 編的原生模組; 少了 package.json
# 會在它與 lock 不一致時命中舊快取, 跳過 npm ci 本來會擋下的錯。
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # 完整歷史: 要和 PR 的 base 比對改了哪些檔案。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: 判斷模式
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=""
          if [ "${EVENT}" = pull_request ]; then
            files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          fi
          mode="$(printf '%s\n' "${files}" | .github/scripts/ci-mode.sh "${EVENT}")"
          echo "模式：${mode}" >> "${GITHUB_STEP_SUMMARY}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

  lint:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/cache@v6
        id: web-node-modules
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package.json', 'apps/web/package-lock.json') }}
      - if: steps.web-node-modules.outputs.cache-hit != 'true'
        run: cd apps/web && npm ci
      # runner 內建的 shellcheck 跟本機的版本不同, 同一份腳本會一邊綠一邊紅。版本取自
      # scripts/lib/shellcheck.sh (唯一來源), sha256 是 GitHub release 頁面上該檔案的 digest。
      # 放在 PATH 最前面蓋過內建的那一版; make check lint 會再確認版本, 沒生效就失敗。
      - name: 安裝指定版本的 shellcheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          version="$(sed -n 's/^SHELLCHECK_VERSION="\(.*\)"$/\1/p' scripts/lib/shellcheck.sh)"
          [ -n "${version}" ] || { echo "scripts/lib/shellcheck.sh 找不到 SHELLCHECK_VERSION" >&2; exit 1; }
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          tar -xJf "${archive}" -C "${RUNNER_TEMP}/shellcheck" --strip-components=1
          echo "${RUNNER_TEMP}/shellcheck" >> "${GITHUB_PATH}"
      - run: make check lint

  contract:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/cache@v6
        id: web-node-modules
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package.json', 'apps/web/package-lock.json') }}
      - if: steps.web-node-modules.outputs.cache-hit != 'true'
        run: cd apps/web && npm ci
      - run: make check contract

  migrate:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 要和最近的 release tag 比對; 預設只抓一個 commit、不抓 tag,
      # 找不到 tag 時檢查會當成「還沒發版」而略過。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - run: make check migrate

  types:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/cache@v6
        id: web-node-modules
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package.json', 'apps/web/package-lock.json') }}
      - if: steps.web-node-modules.outputs.cache-hit != 'true'
        run: cd apps/web && npm ci
      - run: make check types

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/cache@v6
        id: web-node-modules
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package.json', 'apps/web/package-lock.json') }}
      - if: steps.web-node-modules.outputs.cache-hit != 'true'
        run: cd apps/web && npm ci
      - run: make check web-test

  build:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/cache@v6
        id: web-node-modules
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package.json', 'apps/web/package-lock.json') }}
      - if: steps.web-node-modules.outputs.cache-hit != 'true'
        run: cd apps/web && npm ci
      - run: make check build

  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --frozen
      - run: make check api-test

  api-integration:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI 沒有 `make init` 產生的 .env, 拋棄式容器的名稱前綴改用 repo 名稱。
    env:
      COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --frozen
      - run: make check integration

  e2e:
    needs: [changes]
    if: needs.changes.outputs.mode == 'full'
    # 依檔案分份 (Playwright --shard), 每份各起一套拋棄式環境: 同一套加 worker 會跟服務搶 CPU,
    # 同一 IP 的登入次數也會碰到限流。每份的固定成本 (裝瀏覽器、建 image、起環境) 約 75 秒,
    # Summary 記下每份 Playwright 本身的秒數, 接近固定成本時就加一份 (docs/testing.md)。
    # 一份失敗不取消其他份: 各份的結果都要看到; ci-gate 看的是全部份數彙總後的結果。
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 同 api-integration: CI 沒有 .env, 拋棄式 stack 的名稱前綴改用 repo 名稱。
    env:
      COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: cd e2e && npm ci
      # 瀏覽器要的系統套件需要 sudo, check.sh 只下載瀏覽器, 所以這一步只在 CI。
      - run: cd e2e && npx playwright install --with-deps chromium
      # 快取 scope 與 deploy.yml 的 build 共用: 部署時讀的就是這裡寫進去的層。
      # load 進 runner 的 docker 給 compose 用, 不推到任何 registry。
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          target: base
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          load: true
          tags: ci-api:e2e
      - uses: docker/build-push-action@v7
        with:
          context: apps/web
          target: prod
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          load: true
          tags: ci-web:e2e
      # 真金鑰被烤進 image 時一切照常運作, 只有這裡看得到 (理由見 apps/web/Dockerfile)。
      # 期望值從 Dockerfile 讀, 不另抄一份。
      - name: web image 裡只有公開的 id salt
        run: |
          salt="$(sed -n 's/^ARG NEXT_ACTIONS_ID_SALT="\(.*\)"$/\1/p' apps/web/Dockerfile)"
          [ -n "${salt}" ] || { echo "apps/web/Dockerfile 找不到 NEXT_ACTIONS_ID_SALT" >&2; exit 1; }
          docker run --rm --entrypoint node -e EXPECTED_SALT="${salt}" ci-web:e2e -e '
            const key = require("./.next/server/server-reference-manifest.json").encryptionKey
            if (key !== process.env.EXPECTED_SALT) {
              console.error("image 裡的 Server Action 金鑰不是 Dockerfile 的公開常數")
              process.exit(1)
            }'
      - run: make check e2e
        env:
          API_IMAGE: ci-api:e2e
          WEB_IMAGE: ci-web:e2e
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # 失敗時的 trace 用 `npx playwright show-trace <zip>` 打開, 看得到每一步的畫面與網路請求。
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # 預設上游失敗時會跳過, 而被跳過的 required check 在 GitHub 上算通過, 所以一定要 always()。
  ci-gate:
    needs: [changes, lint, contract, migrate, types, web-test, build, api-test, api-integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/scripts
      - name: 判定全部 job 的結果
        env:
          NEEDS: ${{ toJSON(needs) }}
          MODE: ${{ needs.changes.outputs.mode }}
        run: printf '%s' "${NEEDS}" | .github/scripts/ci-gate.sh "${MODE}"
