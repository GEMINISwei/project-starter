# 每個轉給 web 的 location 都 include 這份 (apps/api/tests/test_nginx_templates.py 守)。
#
# 以下四個標頭一律**覆寫**而不是附加: 用戶端送來的值全部蓋掉。
# X-Real-IP 是登入與註冊限流的 key, 用 $proxy_add_x_forwarded_for 的話第一段由
# 用戶端說了算, 限流就形同虛設。X-Request-ID 會寫進三層的 log, 覆寫才偽造不了。
#
# 前提是 **nginx 就是最外層**。前面接了 CDN/LB 時改用 ngx_http_realip_module,
# 見 docs/operations.md 的「用戶端 IP 與限流」。
proxy_set_header   Host              $http_host;
proxy_set_header   X-Request-ID      $request_id;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
