# 兩份模板在 http 層 (server 區塊外) include 這份。
#
# 這個 nginx 一定在主機的 reverse proxy 後面 (TLS 在那層結束), 連進來的是主機, 不是用戶端。
# 不信任上一層的話, 全站共用一份登入限流額度, cookie 也會失去 `Secure`。
#
# 信任的前提是**只有主機連得到這裡**: compose 把 port 綁在 127.0.0.1, 外部請求一定先經過
# 主機那層, 由它覆寫這兩個標頭 (範例見 infra/host-nginx/example.conf)。改成綁 0.0.0.0 的話,
# 任何人都能自己帶 X-Real-IP 冒充別人的 IP。

# 主機經 docker 的 port 轉進來時, 來源是 loopback 或 docker 網路的 gateway, 都在這幾段裡。
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
# 用 X-Real-IP 而不是 X-Forwarded-For: 主機以 `$remote_addr` 覆寫它, 只有一個值, 用戶端偽造不了;
# X-Forwarded-For 是附加的, 最前面那段由用戶端說了算。
real_ip_header X-Real-IP;

# 上一層送 http/https 就沿用, 其他值 (含沒送, 例如開發時直接連) 退回這一層看到的協定。
# 多層 proxy 會串成 "https, http", 第一段才是面對用戶端的那層。
map $http_x_forwarded_proto $forwarded_proto {
    default  $scheme;
    ~*^https https;
    ~*^http  http;
}
