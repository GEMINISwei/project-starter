# 兩份模板共用的回應標頭, 在 server 層 include。
#
# `always`: 否則 4xx/5xx 回應不會帶。`add_header` 不會累加 —— 任何 location
# 自己寫了 add_header, server 層的就全部消失, 要在那個 location 再 include 一次這份。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 刻意只放 frame-ancestors: Next 會產生 inline script, 沒調校過的 script-src 會讓
# 應用直接壞掉。要收緊請搭配 Next 的 nonce 機制。
add_header Content-Security-Policy "frame-ancestors 'none'" always;
