# access log 的格式, 兩份模板都在最上面 (http 層) include, 再由 server 區塊的 `access_log` 選用。
#
# 預設的 `combined` 沒有 request id: 同一次請求在 nginx、web、api 的紀錄就對不起來
# (docs/operations.md)。rt 是整個請求的時間, upstream 是 web 花的時間, 兩者差很多代表慢在
# nginx 或網路這一段。
#
# 路徑用 `$uri`, 不用帶著 query string 的完整請求行: 敏感內容會長期留在 log 裡 (同 api 的請求紀錄)。
# `access_log` 不寫在這裡: http 層的那一條會跟映像檔 nginx.conf 的並存, 每個請求記兩次。
log_format request_id '$time_iso8601 [$request_id] $remote_addr '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      'rt=$request_time upstream=$upstream_response_time "$http_user_agent"';
