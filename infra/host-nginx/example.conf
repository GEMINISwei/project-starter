# 部署主機上的 reverse proxy 範例 (主機自己的 nginx, 不是 compose 裡那個)。
#
# 這份不會被任何東西載入。複製到主機後改網域、憑證路徑與 SYSTEM_PORT;
# 同主機有多套系統時每套一份, 各指向自己的 SYSTEM_PORT。
# 憑證要先申請才能套用這份, 否則 nginx -t 會失敗: 步驟見 docs/operations.md 的「設定網域」。
# 標了「必要」的幾行省了不會有錯誤訊息, 說明見 docs/operations.md 的「主機的 reverse proxy」。
# 其餘是建議的強化 (HTTP/2、版本號、HSTS), 不加也能運作。

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    # http2: 同一條連線平行傳多個請求, 頁面的 JS/CSS 小檔案載入較快。
    # nginx 1.25.1 起改寫成 `listen 443 ssl;` 加一行 `http2 on;`, 舊寫法會出現棄用警告。
    listen 443 ssl http2;
    server_name example.com;

    # 錯誤頁與 Server 標頭不帶版本號。
    server_tokens off;

    # HSTS: 瀏覽器一年內只用 HTTPS 連這個網域, 第一次連線不會先送出可被攔截的 HTTP 請求。
    # 生效後撤不回來: 憑證過期時已連過的瀏覽器會直接拒絕連線, 使用者也無法略過警告。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 用 certbot 的話這幾行由它管理, 保留它寫進來的即可。
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 必要: 與專案固定的上傳上限相同 (docs/extending.md 的「大小上限」)。
    # nginx 預設只有 1m, 沒設的話超過 1m 的上傳在這層就被擋下, 到不了應用。
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;   # 改成這套的 SYSTEM_PORT

        proxy_set_header Host              $host;
        # 必要: 登入限流的 key。用 $remote_addr 覆寫, 容器內的 nginx 信任這個值。
        proxy_set_header X-Real-IP         $remote_addr;
        # 必要: 少了它 cookie 不會帶 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
