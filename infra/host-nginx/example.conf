# 部署主機上的 reverse proxy 範例 (主機自己的 nginx, 不是 compose 裡那個)。
#
# 這份不會被任何東西載入, 複製到主機 (例如 /etc/nginx/sites-available/<網域>) 後改三處:
# 網域、憑證路徑、SYSTEM_PORT。同主機有多套系統時, 每套一份, 各指向自己的 SYSTEM_PORT。
#
# 容器內的 nginx **信任**這一層送來的 X-Real-IP 與 X-Forwarded-Proto
# (infra/nginx/snippets/trusted-proxy.conf), 所以標了「必要」的那幾行不能省,
# 省了不會有錯誤訊息, 只會讓限流與 cookie 安靜地出錯。說明見 docs/operations.md 的
# 「主機的 reverse proxy」。

# HTTP 一律轉到 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 之前的版本沒有這個指令, 改寫成 `listen 443 ssl http2;`。
    http2 on;
    server_name example.com;

    # 用 certbot 的話這幾行由它管理, 保留它寫進來的即可。
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 必要: 不能小於容器的 16m (nginx 預設只有 1m), 否則介於兩者之間的上傳在這層就被擋下。
    client_max_body_size 16m;

    # 錯誤頁與 Server 標頭不帶版本號。
    server_tokens off;

    # 告訴瀏覽器之後只用 HTTPS 連線。TLS 在這層結束, 所以由這層送。確定所有子網域都有 HTTPS
    # 之後才加 `includeSubDomains`: 加了就收不回來, 直到 max-age 過期。
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;   # 改成這套的 SYSTEM_PORT

        proxy_set_header Host              $host;
        # 必要: 登入限流的 key。一定要用 $remote_addr **覆寫**, 不要沿用用戶端送來的值。
        proxy_set_header X-Real-IP         $remote_addr;
        # 必要: 決定 cookie 帶不帶 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
